name: Monitor reading snapshot

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freshness:
    if: vars.STATUS_MONITOR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node scripts/monitor.ts
        env:
          STATUS_URL: ${{ vars.STATUS_URL }}
          MAX_SNAPSHOT_AGE_HOURS: ${{ vars.MAX_SNAPSHOT_AGE_HOURS || '48' }}
